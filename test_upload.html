<!DOCTYPE html>
<html>
<head>
    <title>Test Upload</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 600px; margin: 0 auto; }
        .form-group { margin: 20px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ddd; }
        button { background: #007bff; color: white; padding: 12px 24px; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 15px; background: #f8f9fa; border: 1px solid #dee2e6; }
        .error { background: #f8d7da; border-color: #f5c6cb; color: #721c24; }
        .success { background: #d4edda; border-color: #c3e6cb; color: #155724; }
    </style>
</head>
<body>
    <div class="container">
        <h1>MapScribe AI - Test Upload</h1>
        
        <form id="uploadForm" enctype="multipart/form-data">
            <div class="form-group">
                <label for="file">Select Image File:</label>
                <input type="file" id="file" name="file" accept=".jpg,.jpeg,.png,.tiff,.tif,.bmp" required>
            </div>
            
            <div class="form-group">
                <button type="submit">Upload and Process</button>
            </div>
        </form>
        
        <div id="result" class="result" style="display: none;"></div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData();
            const fileInput = document.getElementById('file');
            const resultDiv = document.getElementById('result');
            
            if (!fileInput.files[0]) {
                showResult('Please select a file', 'error');
                return;
            }
            
            formData.append('file', fileInput.files[0]);
            formData.append('task', 'task4');
            formData.append('confidence', '0.5');
            formData.append('language', 'auto');
            
            showResult('Uploading...', 'info');
            
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    showResult(`
                        <h3>✅ Upload Successful!</h3>
                        <p><strong>File ID:</strong> ${result.file_id}</p>
                        <p><strong>Detections:</strong> ${result.results.total_detections}</p>
                        <p><strong>Processing Time:</strong> ${result.results.processing_time}s</p>
                        <p><strong>File Size:</strong> ${result.results.file_info.size_mb} MB</p>
                        <h4>Results:</h4>
                        <pre>${JSON.stringify(result.results.categorized_results, null, 2)}</pre>
                    `, 'success');
                } else {
                    showResult(`
                        <h3>❌ Upload Failed</h3>
                        <p><strong>Error:</strong> ${result.error}</p>
                        ${result.traceback ? `<pre>${result.traceback}</pre>` : ''}
                    `, 'error');
                }
            } catch (error) {
                showResult(`
                    <h3>❌ Network Error</h3>
                    <p>${error.message}</p>
                `, 'error');
            }
        });
        
        function showResult(html, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = html;
            resultDiv.className = `result ${type}`;
            resultDiv.style.display = 'block';
        }
        
        // Check server status on load
        fetch('/api/status')
            .then(response => response.json())
            .then(data => {
                console.log('Server status:', data);
                document.title = `${data.name} - Test Upload`;
            })
            .catch(error => {
                console.error('Server not reachable:', error);
                showResult('⚠️ Server not reachable', 'error');
            });
    </script>
</body>
</html>
