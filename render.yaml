services:
  - type: web
    name: mapscribe-ai
    env: python
    buildCommand: "./render-build.sh"
    startCommand: "gunicorn app:application"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: app.py
    healthCheckPath: /api/status